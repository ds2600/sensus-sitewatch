{% extends "base.html" %}
{% block content %}
<h4>{{ 'Edit site' if site else 'Add site' }}</h4>
<form method="post" class="col-md-4">
  <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ site.name if site else '' }}" required></div>
  <div class="mb-3"><label class="form-label">Latitude</label><input class="form-control" name="lat" type="number" step="any" value="{{ site.lat if site else '' }}" required></div>
  <div class="mb-3"><label class="form-label">Longitude</label><input class="form-control" name="lon" type="number" step="any" value="{{ site.lon if site else '' }}" required></div>
  <div class="mb-3">
    <label class="form-label">Type</label>
    <select class="form-select" name="site_type">
      <option value="site" {{ 'selected' if not site or site.site_type == 'site' else '' }}>Site (has equipment)</option>
      <option value="passthrough" {{ 'selected' if site and site.site_type == 'passthrough' else '' }}>Passthrough (map waypoint only, no equipment)</option>
    </select>
    <div class="form-text">Passthrough: map marker only, no devices.</div>
  </div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
