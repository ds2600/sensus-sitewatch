{% extends "base.html" %}
{% block content %}
<h4>Add site</h4>
<form method="post" class="col-md-4">
  <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
  <div class="mb-3"><label class="form-label">Latitude</label><input class="form-control" name="lat" type="number" step="any" required></div>
  <div class="mb-3"><label class="form-label">Longitude</label><input class="form-control" name="lon" type="number" step="any" required></div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
