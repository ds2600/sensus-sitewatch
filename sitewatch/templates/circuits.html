{% extends "base.html" %}
{% block content %}
<a class="btn btn-primary mb-3" href="{{ url_for('circuits.add_circuit') }}">Add circuit</a>
<table class="table">
  <thead><tr><th>Name</th><th>Role</th><th>Type</th><th>State</th></tr></thead>
  <tbody>
    {% for c in circuits %}
    <tr>
      <td><a href="{{ url_for('circuits.circuit_detail', circuit_id=c.id) }}">{{ c.name }}</a></td>
      <td>{{ c.role.name }} ({{ c.role.tier }})</td>
      <td>{{ 'bundle' if c.is_bundle else 'point-to-point' }}</td>
      <td><span class="badge bg-secondary">{{ c.current_state }}</span></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
