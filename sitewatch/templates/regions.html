{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2">
  <h4>Manage regions</h4>
  <button type="button" class="btn btn-primary btn-sm" id="save_region_btn">Save current view as region</button>
</div>
<p class="text-body-secondary small">Pan/zoom to the view you want, then save it as a named region.</p>
<div id="region-edit-map" class="mb-4 rounded"></div>

<h5>Saved regions</h5>
<table class="table table-sm col-md-6">
  <thead><tr><th>Name</th><th>Zoom</th><th></th><th></th></tr></thead>
  <tbody>
    {% for r in regions %}
    <tr>
      <td>{{ r.name }}</td>
      <td>{{ r.zoom }}</td>
      <td>
        <button type="button" class="btn btn-outline-secondary btn-sm"
                data-goto-lat="{{ r.center_lat }}" data-goto-lon="{{ r.center_lon }}" data-goto-zoom="{{ r.zoom }}">
          Go to
        </button>
      </td>
      <td>
        <form method="post" action="{{ url_for('regions.delete_region', region_id=r.id) }}"
              onsubmit="return confirm('Delete region {{ r.name }}?');">
          <button class="btn btn-outline-danger btn-sm">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr><td colspan="4" class="text-muted">None yet.</td></tr>
    {% endfor %}
  </tbody>
</table>

<div class="modal" id="save-region-modal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" action="{{ url_for('regions.add_region') }}">
        <div class="modal-header">
          <h5 class="modal-title">Save region</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input class="form-control" name="name" placeholder="Region name" required autofocus>
          <input type="hidden" name="center_lat" id="save_center_lat">
          <input type="hidden" name="center_lon" id="save_center_lon">
          <input type="hidden" name="zoom" id="save_zoom">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='js/region_editor.js') }}"></script>
{% endblock %}
