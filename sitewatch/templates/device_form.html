{% extends "base.html" %}
{% block content %}
<h4>Add device</h4>
<form method="post" class="col-md-6">
  <div class="mb-3"><label class="form-label">Site</label>
    <select class="form-select" name="site_id" required>
      {% for s in sites %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
    </select>
  </div>
  <div class="mb-3"><label class="form-label">Hostname</label><input class="form-control" name="hostname" required></div>
  <div class="mb-3"><label class="form-label">Management IP</label><input class="form-control" name="mgmt_ip" required></div>
  <div class="mb-3"><label class="form-label">Vendor</label>
    <select class="form-select" name="vendor">{% for v in vendors %}<option value="{{ v }}">{{ v }}</option>{% endfor %}</select>
  </div>
  <div class="mb-3"><label class="form-label">SNMP version</label>
    <select class="form-select" name="snmp_version" onchange="toggleSnmpFields(this.value)">
      {% for v in snmp_versions %}<option value="{{ v }}">{{ v }}</option>{% endfor %}
    </select>
  </div>

  <div id="snmp-community-fields">
    <div class="mb-3"><label class="form-label">Community string</label><input class="form-control" name="snmp_community"></div>
  </div>
  <div id="snmp-v3-fields" class="d-none">
    <div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="snmpv3_username"></div>
    <div class="mb-3"><label class="form-label">Auth protocol</label>
      <select class="form-select" name="snmpv3_auth_protocol"><option>SHA</option><option>MD5</option><option value="none">none</option></select>
    </div>
    <div class="mb-3"><label class="form-label">Auth key</label><input class="form-control" name="snmpv3_auth_key"></div>
    <div class="mb-3"><label class="form-label">Priv protocol</label>
      <select class="form-select" name="snmpv3_priv_protocol"><option>AES</option><option>DES</option><option value="none">none</option></select>
    </div>
    <div class="mb-3"><label class="form-label">Priv key</label><input class="form-control" name="snmpv3_priv_key"></div>
  </div>

  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
{% block scripts %}
<script>
function toggleSnmpFields(version) {
  document.getElementById('snmp-community-fields').classList.toggle('d-none', version === 'v3');
  document.getElementById('snmp-v3-fields').classList.toggle('d-none', version !== 'v3');
}
</script>
{% endblock %}
