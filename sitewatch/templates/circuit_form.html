{% extends "base.html" %}
{% block content %}
<h4>Add circuit</h4>
<form method="post" class="col-md-6">
  <div class="mb-3"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
  <div class="mb-3"><label class="form-label">Role</label>
    <select class="form-select" name="role_id">{% for r in roles %}<option value="{{ r.id }}">{{ r.name }} ({{ r.tier }})</option>{% endfor %}</select>
  </div>
  <div class="mb-3"><label class="form-label">Parent bundle (optional)</label>
    <select class="form-select" name="parent_circuit_id">
      <option value="">None</option>
      {% for b in bundles %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
    </select>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="is_bundle" id="is_bundle" onchange="document.getElementById('leaf-fields').classList.toggle('d-none', this.checked)">
    <label class="form-check-label" for="is_bundle">This is a bundle (no interfaces of its own)</label>
  </div>
  <div id="leaf-fields">
    <div class="mb-3"><label class="form-label">Interface A</label>
      <select class="form-select" name="interface_a_id">{% for i in interfaces %}<option value="{{ i.id }}">{{ i.device.hostname }} — {{ i.if_descr }}</option>{% endfor %}</select>
    </div>
    <div class="mb-3"><label class="form-label">Interface B</label>
      <select class="form-select" name="interface_b_id">{% for i in interfaces %}<option value="{{ i.id }}">{{ i.device.hostname }} — {{ i.if_descr }}</option>{% endfor %}</select>
    </div>
  </div>
  <div class="mb-3"><label class="form-label">Capacity override (bps, optional)</label><input class="form-control" name="capacity_override"></div>
  <button class="btn btn-primary">Save</button>
</form>
{% endblock %}
